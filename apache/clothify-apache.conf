# Clothify Apache include for XAMPP / Apache main-server mode.
# Usage:
# 1. Keep the default XAMPP config in httpd.conf unchanged.
# 2. Add this line near the end of httpd.conf:
#    Include "C:/Users/asus/Downloads/Web-2/apache/clothify-apache.conf"
# 3. Restart Apache.

DocumentRoot "C:/Users/asus/Downloads/Web-2/public-apache"

<Directory "C:/Users/asus/Downloads/Web-2/public-apache">
    Options Indexes FollowSymLinks Includes ExecCGI
    AllowOverride All
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>
